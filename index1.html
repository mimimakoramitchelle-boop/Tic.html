<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Quest · Brain Power Arena</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700 w-full max-w-md p-6 sm:p-8 rounded-3xl shadow-2xl">
        <div class="text-center mb-6">
            <span class="inline-block bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2">
                Anti-Social Media Detox
            </span>
            <h1 class="text-2xl font-black text-white">Focus Quest</h1>
            <p class="text-xs text-slate-400 mt-1">Beat the 15-second clock to boost academic IQ!</p>
        </div>

        <div class="flex justify-between items-center bg-slate-900/60 p-3 rounded-2xl border border-slate-700/60 mb-4 text-xs font-bold">
            <div class="text-amber-400">⭐ Score: <span id="score" class="text-sm">0</span></div>
            <div class="text-emerald-400">🔥 Streak: <span id="streak">0</span></div>
            <div class="text-rose-400">⏳ Time: <span id="timer" class="text-sm">15s</span></div>
        </div>

        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden mb-6">
            <div id="progressBar" class="bg-emerald-500 h-full w-full transition-all duration-1000"></div>
        </div>

        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 text-center mb-5 min-h-[110px] flex flex-col justify-center">
            <span id="category" class="text-xs font-extrabold text-indigo-400 uppercase tracking-widest mb-1">MATH REFLEX</span>
            <h2 id="questionText" class="text-lg font-bold text-white">Loading question...</h2>
        </div>

        <div id="optionsContainer" class="grid grid-cols-2 gap-3 mb-5"></div>

        <p id="feedbackText" class="text-center text-xs font-bold text-slate-400 mb-4 min-h-[18px]">
            Choose an answer to sharpen your focus!
        </p>

        <button id="resetBtn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 rounded-xl text-xs transition cursor-pointer">
            🔄 Restart Game
        </button>
    </div>
    <script src="focus-master.js"></script>
</body>
</html>
